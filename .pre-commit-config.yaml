# Hooks for the template repo itself (generated repos get template/.pre-commit-config.yaml.jinja).
# Revs are full commit SHAs. Install with: uvx pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: evals[^/]*/run\.py\.lock$  # the template's hash-locked eval deps, ~550 KB
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        files: ^copier\.yml$
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/

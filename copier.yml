# Repo template — Copier configuration.
# Delimiters are [[ ]] / [% %] so GitHub Actions' ${{ }} needs no escaping.
_min_copier_version: "9.4"
_subdirectory: template
_answers_file: .copier-answers.yml
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

# ---------------------------------------------------------------- identity
project_name:
  type: str
  help: Human-readable project name
  validator: "[% if not project_name.strip() %]Required[% endif %]"

project_slug:
  type: str
  help: Repository / package name (lowercase, dashes)
  default: "[[ project_name.strip().lower().replace(' ', '-').replace('_', '-') ]]"
  validator: >-
    [% if project_slug != project_slug.lower() or not project_slug.replace('-', '').isalnum() %]Use lowercase letters, digits and dashes[% endif %]

repo_name:
  type: str
  help: >-
    GitHub repository name, exactly as on GitHub (capitals, dots and underscores allowed).
    Defaults to the project name when that is already a valid repo name, else to the slug
  default: >-
    [% set n = project_name.strip() %][% if n and n.isascii() and n.replace('-', '').replace('_', '').replace('.', '').isalnum() %][[ n ]][% else %][[ project_slug ]][% endif %]
  validator: >-
    [% if not (repo_name.isascii() and repo_name.replace('-', '').replace('_', '').replace('.', '').isalnum()) %]Use letters, digits, dots, dashes and underscores[% endif %]

package_name:
  type: str
  help: Python import name
  default: "[[ project_slug.replace('-', '_') ]]"
  when: "[[ 'python' in languages ]]"

description:
  type: str
  help: One-line description
  default: ""

author_name:
  type: str
  help: Author name

author_email:
  type: str
  help: Author email (used in package metadata and SECURITY.md for private repos)

github_owner:
  type: str
  help: GitHub user or organization that will own the repo

# ---------------------------------------------------------------- shape
languages:
  type: str
  help: >-
    Managed languages: the template writes and updates their toolchain, CI and releases
    (one = files at the root; several = one folder each). Pick none for a baseline repo
    that keeps its own stack: it gets security scanning, Dependabot, the merge gate and agent config only
  multiselect: true
  choices:
    Python: python
    TypeScript: typescript
    Rust: rust
    Go: go
  default: [python]

# Computed (not asked), here because questions below use them: Copier fills defaults in order.
multi_lang:
  type: bool
  default: "[[ languages | length > 1 ]]"
  when: false
# Each managed language's folder: its id when there are several, else the root.
lang_dir:
  type: json
  default: >-
    {[% for l in languages %]"[[ l ]]": "[[ l if languages | length > 1 else '.' ]]"[% if not loop.last %], [% endif %][% endfor %]}
  when: false

extra_ecosystems:
  type: str
  help: >-
    Dependabot ecosystems at the repo root that the managed languages don't cover
    (for a baseline repo: whatever its own stack uses). GitHub Actions is always on
  multiselect: true
  choices:
    "pip (requirements.txt, setup.py)": pip
    "uv (pyproject.toml + uv.lock)": uv
    "npm (also pnpm and yarn)": npm
    Bun: bun
    Cargo: cargo
    Go modules: gomod
    Docker: docker
  default: []

visibility:
  type: str
  help: Repo visibility (decides which GitHub security features are free)
  choices: [public, private]
  default: private

github_plan:
  type: str
  help: Your GitHub plan (Pro is needed for rulesets and environments on private repos)
  choices: [free, pro]
  default: free

license:
  type: str
  help: Licence
  choices: [MIT, Apache-2.0, Proprietary]
  default: "[% if visibility == 'public' %]MIT[% else %]Proprietary[% endif %]"

agentic:
  type: bool
  help: Is this an agentic / LLM application? (adds threat model sections, agent policy, evals)
  default: true

publishes:
  type: bool
  help: Will you publish releases (packages to PyPI / npm / crates.io, Go binaries on GitHub releases)?
  default: false
  # The template only releases managed languages; a baseline repo keeps its own release workflow.
  when: "[[ languages | length > 0 ]]"

# ---------------------------------------------------------------- third-party services
ai_reviewers:
  type: str
  help: AI PR reviewers to wire in (CodeRabbit is free on public repos only)
  multiselect: true
  choices:
    "Claude Code GitHub Action (uses your Claude subscription)": claude
    "CodeRabbit (GitHub App + .coderabbit.yaml)": coderabbit
  default: "[% if visibility == 'public' %][claude, coderabbit][% else %][claude][% endif %]"

quality_platform:
  type: str
  help: Code-quality platform (SonarQube Cloud is free and complete for public repos; private free plan is limited)
  choices:
    None: none
    SonarQube Cloud: sonarqube-cloud
  default: "[% if visibility == 'public' %]sonarqube-cloud[% else %]none[% endif %]"

sonar_organization:
  type: str
  help: SonarQube Cloud organization key
  default: "[[ github_owner | lower ]]"
  when: "[[ quality_platform == 'sonarqube-cloud' ]]"

# ---------------------------------------------------------------- toolchains
python_version:
  type: str
  help: Minimum Python version
  default: "3.13"
  when: "[[ 'python' in languages ]]"
  validator: >-
    [% set p = python_version.split('.') %][% if p | length != 2 or p[0] != '3' or not p[1].isdigit() %]Use 3.N, e.g. 3.13[% endif %]

python_max_version:
  type: str
  help: >-
    Newest supported Python minor (e.g. 3.13), for dependencies that don't support the latest yet.
    Empty = no cap: CI tests up to the newest release the template knows
  default: ""
  when: "[[ 'python' in languages ]]"
  validator: >-
    [% if python_max_version %][% set p = python_max_version.split('.') %][% if p | length != 2 or p[0] != '3' or not p[1].isdigit() %]Use 3.N, e.g. 3.13, or leave empty[% elif p[1] | int < python_version.split('.')[1] | int %]Must not be older than the minimum ([[ python_version ]])[% endif %][% endif %]

python_type_checker:
  type: str
  help: Python type checker (both stable; reference projects are split)
  choices: [pyright, mypy]
  default: pyright
  when: "[[ 'python' in languages ]]"

node_version:
  type: str
  help: Node.js LTS major
  choices: ["24", "26"]
  default: "26"
  when: "[[ 'typescript' in languages ]]"

ts_linter:
  type: str
  help: TypeScript linter (ESLint + typescript-eslint is the default; Oxlint is faster)
  choices: [eslint, oxlint]
  default: eslint
  when: "[[ 'typescript' in languages ]]"

rust_toolchain:
  type: str
  help: Pinned Rust toolchain
  default: "1.99.0"
  when: "[[ 'rust' in languages ]]"

rust_msrv:
  type: str
  help: Minimum supported Rust version (rust-version in Cargo.toml)
  default: "1.97"
  when: "[[ 'rust' in languages ]]"

go_version:
  type: str
  help: >-
    Minimum Go version (the go line in go.mod). CI tests every minor from here up to the
    newest the template knows. Raise it later with `copier update -d go_version=1.N`
  default: "1.26"
  when: "[[ 'go' in languages ]]"
  validator: >-
    [% set p = go_version.split('.') %][% if p | length != 2 or p[0] != '1' or not p[1].isdigit() %]Use 1.N, e.g. 1.26[% endif %]

go_module:
  type: str
  help: >-
    Go module path (the module line in go.mod). A vanity path or another host works too;
    for v2 and later it ends in /vN
  default: "github.com/[[ github_owner ]]/[[ repo_name ]][% if multi_lang %]/[[ lang_dir.go ]][% endif %]"
  when: "[[ 'go' in languages ]]"
  validator: >-
    [% if go_module.split() | length != 1 or go_module != go_module.strip() or '.' not in go_module.split('/')[0] %]Use a module path like github.com/owner/repo: no spaces, and a host with a dot first[% endif %]

# ---------------------------------------------------------------- computed (not asked)
baseline:
  type: bool
  default: "[[ languages | length == 0 ]]"
  when: false
is_public:
  type: bool
  default: "[[ visibility == 'public' ]]"
  when: false
has_governance:
  type: bool
  default: "[[ visibility == 'public' or github_plan == 'pro' ]]"
  when: false
is_oss:
  type: bool
  default: "[[ license != 'Proprietary' ]]"
  when: false

# The local CI workflow is written once and then belongs to the repo (ADR 0002).
_skip_if_exists:
  - .github/workflows/ci-local.yml

# ---------------------------------------------------------------- post-generation (local only)
_tasks:
  - command: chmod +x scripts/bootstrap-github.sh .claude/hooks/format.sh
  - command: uv lock --project .github/tools
    when: "[[ _copier_operation == 'copy' ]]"
  # Each managed language's lock step (includes/languages.json), in its folder.
  - command: >-
      [% from 'includes/languages.jinja' import managed with context %][% for l in managed.values() %](cd '[[ l.dir ]]' && if command -v [[ l.toolchain ]] >/dev/null; then [[ l.lock ]]; else echo '[[ l.toolchain ]] not found: run [[ l.lock ]] in [[ l.dir ]] later'; fi) && [% endfor %]true
    when: "[[ _copier_operation == 'copy' and languages ]]"

_message_after_copy: |
  Generated [[ project_name ]].
  Next:  cd [[ _copier_conf.dst_path ]] && ./scripts/bootstrap-github.sh --dry-run
  Then follow the manual checklist the script prints (also in docs/SETUP.md).

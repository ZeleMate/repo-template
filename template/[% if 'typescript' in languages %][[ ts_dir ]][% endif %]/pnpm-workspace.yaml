# pnpm settings (pnpm 11+ reads these from pnpm-workspace.yaml).
# Supply-chain cooldown: ignore versions published in the last 7 days (in minutes),
# the same window as uv and Dependabot.
minimumReleaseAge: 10080
# Refuse to install a version whose publish trust level is lower than earlier versions'.
trustPolicy: no-downgrade
# Dependency install scripts are blocked by default; allowlist packages here when needed.
onlyBuiltDependencies: []

name: CI

# Tests the template itself: renders every answer set and runs the real toolchains on the output.
# Weekly as well, because a new upstream release can break a generated repo with no change here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-template:
    name: test-template
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Copier renders from a clone of this checkout
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Read toolchain versions from the template
        id: versions
        run: |
          {
            echo "pnpm=$(grep -oE '"packageManager": "pnpm@[0-9.]+' template/*/package.json.jinja | grep -oE '[0-9.]+$')"
            echo "node=$(awk '/^node_version:/{f=1} f && /default:/{gsub(/[^0-9]/,""); print; exit}' copier.yml)"
            echo "rust=$(awk '/^rust_toolchain:/{f=1} f && /default:/{gsub(/[^0-9.]/,""); print; exit}' copier.yml)"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install the template's default Rust toolchain
        env:
          RUST_VERSION: ${{ steps.versions.outputs.rust }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - name: Lint this repo (pre-commit)
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: Render every answer set and check the output
        run: ./scripts/test-template.sh
      - name: Skill scripts (shellcheck)
        run: shellcheck -S warning scripts/*.sh skills/*/scripts/*.sh

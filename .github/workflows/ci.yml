name: CI

# Tests the template itself: renders every answer set and runs the real toolchains on the output.
# Weekly as well, because a new upstream release can break a generated repo with no change here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-template:
    name: test-template
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Copier renders from a clone of this checkout
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Read toolchain versions from the template
        id: versions
        run: |
          {
            echo "pnpm=$(grep -oE '"packageManager": "pnpm@[0-9.]+' template/*/package.json.jinja | grep -oE '[0-9.]+$')"
            echo "node=$(awk '/^node_version:/{f=1} f && /default:/{gsub(/[^0-9]/,""); print; exit}' copier.yml)"
            echo "rust=$(awk '/^rust_toolchain:/{f=1} f && /default:/{gsub(/[^0-9.]/,""); print; exit}' copier.yml)"
            echo "go=$(jq -r .go.newest includes/languages.json)"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install the template's default Rust toolchain
        env:
          RUST_VERSION: ${{ steps.versions.outputs.rust }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      # The Rust checks' tools, as the central rust workflow installs them, so verify runs every check.
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2  # v2.90.0
        with:
          tool: cargo-nextest,cargo-deny
      # The newest Go the template knows: it builds every answer set, the 1.26-floor ones included.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false  # this repo has no go.sum
      - name: Install golangci-lint (checksum-verified, same version as the central go workflow)
        env:
          GOLANGCI_LINT_VERSION: "2.15.0"
          GOLANGCI_LINT_SHA256: "9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/golangci-lint.tgz" "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  $RUNNER_TEMP/golangci-lint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/golangci-lint.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install osv-scanner (checksum-verified, same version as the central security workflow)
        env:
          OSV_VERSION: "2.7.0"
          OSV_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint this repo (pre-commit)
        run: uvx --no-build pre-commit@4.7.0 run --all-files --show-diff-on-failure
      - name: Bootstrap's apply, dry run and check against recorded GitHub API responses
        run: ./scripts/test-github-settings.sh
      - name: Render every answer set and check the output
        run: ./scripts/test-template.sh
      - name: Skill scripts (shellcheck)
        run: shellcheck -S warning scripts/*.sh skills/*/scripts/*.sh tests/github-settings/bin/gh
